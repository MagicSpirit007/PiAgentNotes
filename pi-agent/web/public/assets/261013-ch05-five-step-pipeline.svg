<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="261013-ch05-five-step-pipeline-title 261013-ch05-five-step-pipeline-desc"><title id="261013-ch05-five-step-pipeline-title">一次工具调用的五步管道</title><desc id="261013-ch05-five-step-pipeline-desc">监听器或契约外异常仍可能中断循环；不能把所有错误都视为工具错误。</desc><defs><marker id="261013-ch05-five-step-pipeline-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8e7767"/></marker></defs><style>text{font-family:Geist,"Microsoft YaHei",sans-serif;fill:#1c1917}.title{font-size:29px;font-weight:650}.eyebrow{font:13px Geist,monospace;letter-spacing:2px;fill:#8a7464}.node{font-size:19px;font-weight:600}.body{font-size:18px}.small{font-size:17px;fill:#57534e}.accent{font-size:23px;fill:#b5523a}.source{font:13px Geist,monospace;fill:#8a7464}.edge{fill:none;stroke:#8e7767;stroke-width:1.8;marker-end:url(#261013-ch05-five-step-pipeline-arrow)}</style><rect width="960" height="720" fill="#faf7f2"/><text x="42" y="48" class="title">一次工具调用的五步管道</text><text x="42" y="78" class="eyebrow">PI SOURCE DIVE  /  v1.2.0</text><rect x="42" y="108" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="108" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="155" class="node">先发 tool_execution_start</text><text x="367" y="140" class="body">查找工具</text><text x="367" y="168" class="body">① prepareArguments → ② Schema 校验</text><path d="M332 149H346" class="edge"/><path d="M185 190V205" class="edge"/><rect x="42" y="208" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="208" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="255" class="node">③ beforeToolCall</text><text x="367" y="255" class="body">允许：进入 execute；阻止：直接形成错误结果</text><path d="M332 249H346" class="edge"/><path d="M185 290V305" class="edge"/><rect x="42" y="308" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="308" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="355" class="node">④ execute</text><text x="367" y="340" class="body">content / details / structuredContent / isError</text><text x="367" y="368" class="body">实际执行计时；异常也转换为错误结果</text><path d="M332 349H346" class="edge"/><path d="M185 390V405" class="edge"/><rect x="42" y="408" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="408" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="455" class="node">⑤ afterToolCall</text><text x="367" y="455" class="body">替换 content 时同步处理 structuredContent</text><path d="M332 449H346" class="edge"/><path d="M185 490V505" class="edge"/><rect x="42" y="508" width="290" height="82" rx="9" fill="#f0e8df" stroke="#d6cec3"/><rect x="350" y="508" width="568" height="82" rx="9" fill="#fffdf9" stroke="#d6cec3"/><text x="58" y="555" class="node">完成</text><text x="367" y="540" class="body">tool_execution_end → toolResult 消息</text><text x="367" y="568" class="body">准备阶段失败会跳过 execute 和 afterToolCall</text><path d="M332 549H346" class="edge"/><text x="42" y="640" class="small">监听器或契约外异常仍可能中断循环；不能把所有错误都视为工具错误。</text><a href="https://github.com/earendil-works/pi/blob/06a466935536f8c9bcacb2d5efc0fc021be1bdff/packages/agent/src/agent-loop.ts" target="_blank"><text x="42" y="698" class="source">packages/agent/src/agent-loop.ts</text></a></svg>
